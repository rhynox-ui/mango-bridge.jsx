[package]
name = "mango-launchpad"
version = "0.1.0"
edition = "2021"
description = "Mango Protocol's Solana bonding-curve launchpad program"

[lib]
crate-type = ["cdylib", "lib"]
name = "mango_launchpad"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
