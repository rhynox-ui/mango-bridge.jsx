<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mango Wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Same three families, same weights, same Google Fonts URL the main
     site's index.html loads — the extension popup should read as the
     same product, not a differently-typeset one. -->
<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>
<!-- Compiled by build.mjs from tailwind-input.css, scoped to just the
     files this popup renders (see tailwind.config.js) — MangoWallet.jsx's
     own layout/spacing/typography classes (rounded-2xl, flex, gap-3,
     text-[13px], ...) need this; its colors come from inline styles
     referencing theme.js's palette, not Tailwind color classes, so this
     stays small. -->
<link rel="stylesheet" href="popup.css" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 400px; max-height: 600px; overflow-y: auto;
    background: #0A0A0B; color: #F5F5F6;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
  }
  /* The full wallet app (MangoWalletTab, rendered when there's no pending
     dApp request) needs room to breathe; the compact approval/onboarding
     screens (rendered via the plain h() helper below) look fine with the
     same padding. */
  #root { padding: 16px; }
  .display { font-family: "Space Grotesk", "Inter", sans-serif; }
  h1 { font-family: "Space Grotesk", "Inter", sans-serif; font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  p { color: #9A9AA0; line-height: 1.5; margin: 0 0 12px; }
  .panel { background: #151517; border: 1px solid #232326; border-radius: 16px; padding: 18px; margin-bottom: 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; color: #F5F5F6; }
  .muted { color: #57575D; }
  .secondary-text { color: #9A9AA0; }
  input, textarea {
    width: 100%; background: #0E0E10; border: 1px solid #232326; border-radius: 12px;
    color: #F5F5F6; padding: 10px 12px; font-size: 13px; margin-bottom: 8px; font-family: inherit;
  }
  textarea { resize: none; font-family: "IBM Plex Mono", ui-monospace, monospace; }
  button {
    width: 100%; padding: 12px; border-radius: 999px; border: none;
    font-family: "Space Grotesk", "Inter", sans-serif; font-weight: 600;
    font-size: 14px; cursor: pointer; margin-bottom: 8px;
  }
  .btn-primary { background: #FF9A2E; color: #0A0A0B; }
  .btn-primary:disabled { background: #1D1D20; color: #57575D; cursor: not-allowed; }
  .btn-secondary { background: #1F1F22; color: #F5F5F6; }
  .btn-danger { background: #D92D20; color: #FFFFFF; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row button { margin-bottom: 0; }
  .error { color: #F97066; font-size: 11.5px; margin: -4px 0 8px; font-family: "Inter", sans-serif; }
  .words-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 12px; }
  .word { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; background: #0E0E10; border-radius: 8px; padding: 6px 8px; }
  .word span { color: #57575D; margin-right: 4px; }
  .origin-badge { font-size: 11px; color: #9A9AA0; word-break: break-all; }
  .link { color: #FF9A2E; text-decoration: none; font-size: 12px; cursor: pointer; }
  a.link { display: block; text-align: center; }
  .icon-circle {
    width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
    background: rgba(255, 154, 46, 0.1); margin: 0 auto 12px;
  }
  .icon-circle svg { display: block; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="popup.bundle.js"></script>
</body>
</html>
