<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mango Wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Same three families, same weights, same Google Fonts URL the main
     site's index.html loads — the extension popup should read as the
     same product, not a differently-typeset one. -->
<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>
<!-- Compiled by build.mjs from tailwind-input.css, scoped to just the
     files this popup renders (see tailwind.config.js) — MangoWallet.jsx's
     own layout/spacing/typography classes (rounded-2xl, flex, gap-3,
     text-[13px], ...) need this; its colors come from inline styles
     referencing theme.js's palette, not Tailwind color classes, so this
     stays small. -->
<link rel="stylesheet" href="popup.css" />
<style>
  /* Real Mango theme tokens (src/theme.js's PALETTE), duplicated here as
     CSS custom properties so the plain-DOM "legacy" screens below (never
     part of the React tree, so they can't just read P from props) can use
     them too. These :root values are the DARK set, used only as the
     first-paint default before popup.js's own applyLegacyThemeVars() runs
     — which it does synchronously, before any legacy screen mounts, using
     the user's actual saved theme preference (loadTheme()) rather than
     always dark. Previously these were hardcoded hex literals baked
     permanently to dark, which meant the approve/connect popup a dApp
     triggers (e.g. clicking Connect on another site) stayed dark even for
     someone who picked Light in Settings — a real, visible inconsistency,
     not just a hardcoded-default nicety. */
  :root {
    --mango-bg: #0A0A0B; --mango-panel: #151517; --mango-panelBorder: #232326; --mango-input: #0E0E10;
    --mango-textPrimary: #F5F5F6; --mango-textSecondary: #9A9AA0; --mango-textMuted: #57575D;
    --mango-divider: #1D1D20; --mango-ctaBg: #F5F5F6; --mango-ctaText: #0A0A0B;
  }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 400px; min-height: 100vh; overflow-y: auto;
    background: var(--mango-bg); color: var(--mango-textPrimary);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
  }
  /* The full wallet app (MangoWalletTab, rendered when there's no pending
     dApp request) needs room to breathe; the compact approval/onboarding
     screens (rendered via the plain h() helper below) look fine with the
     same padding.
     min-height:100vh + a flex column lets WalletDashboard's own flex-1
     Balances panel actually stretch down to fill real leftover space —
     on a real desktop popup 100vh is just the small popup's own real
     viewport (a few hundred px), but on Chromium-for-Android (Kiwi,
     etc.), which renders this as a full page tab rather than a small
     popup, this is the difference between the wallet's dark background
     ending a third of the way down a tall phone screen (the browser's
     own blank canvas showing through below it) and actually filling it. */
  #root { padding: 16px; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; }

  /* Everything below is scoped to #root.legacy — the plain h()-helper
     screens (approval/reject, and onboarding reached via a pending dApp
     request) — never to bare element selectors. A real bug lived here:
     an earlier version styled bare `button`/`input`/`h1`/`p` tags
     globally, which — since both this legacy UI and the real
     MangoWalletTab React tree mount into the same #root — silently
     overrode MangoWalletTab's own Tailwind-positioned elements too
     (worst visible case: PasswordField's absolutely-positioned eye-
     toggle button inheriting `width: 100%` from the bare `button` rule,
     stretching it across the whole field and misplacing the icon).
     Scoping under #root.legacy (added to #root only by the legacy
     render path — see popup.js's mount()) keeps this CSS from ever
     touching React-rendered markup again. */
  #root.legacy .display { font-family: "Space Grotesk", "Inter", sans-serif; }
  #root.legacy h1 { font-family: "Space Grotesk", "Inter", sans-serif; font-size: 15px; font-weight: 600; margin: 0 0 4px; color: var(--mango-textPrimary); }
  #root.legacy p { color: var(--mango-textSecondary); line-height: 1.5; margin: 0 0 12px; }
  #root.legacy .panel { background: var(--mango-panel); border: 1px solid var(--mango-panelBorder); border-radius: 16px; padding: 18px; margin-bottom: 12px; }
  #root.legacy .row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
  #root.legacy .mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; color: var(--mango-textPrimary); }
  #root.legacy .muted { color: var(--mango-textMuted); }
  #root.legacy .secondary-text { color: var(--mango-textSecondary); }
  #root.legacy input, #root.legacy textarea {
    width: 100%; background: var(--mango-input); border: 1px solid var(--mango-panelBorder); border-radius: 12px;
    color: var(--mango-textPrimary); padding: 10px 12px; font-size: 13px; margin-bottom: 8px; font-family: inherit;
  }
  #root.legacy textarea { resize: none; font-family: "IBM Plex Mono", ui-monospace, monospace; }
  #root.legacy button {
    width: 100%; padding: 12px; border-radius: 999px; border: none;
    font-family: "Space Grotesk", "Inter", sans-serif; font-weight: 600;
    font-size: 14px; cursor: pointer; margin-bottom: 8px;
  }
  #root.legacy .btn-primary { background: #FF9A2E; color: #0A0A0B; }
  #root.legacy .btn-primary:disabled { background: var(--mango-divider); color: var(--mango-textMuted); cursor: not-allowed; }
  #root.legacy .btn-secondary { background: var(--mango-panelBorder); color: var(--mango-textPrimary); }
  #root.legacy .btn-danger { background: #D92D20; color: #FFFFFF; }
  #root.legacy .btn-row { display: flex; gap: 8px; }
  #root.legacy .btn-row button { margin-bottom: 0; }
  #root.legacy .error { color: #F97066; font-size: 11.5px; margin: -4px 0 8px; font-family: "Inter", sans-serif; }
  #root.legacy .words-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 12px; }
  #root.legacy .word { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; background: var(--mango-input); border-radius: 8px; padding: 6px 8px; color: var(--mango-textPrimary); }
  #root.legacy .word span { color: var(--mango-textMuted); margin-right: 4px; }
  #root.legacy .origin-badge { font-size: 11px; color: var(--mango-textSecondary); word-break: break-all; }
  #root.legacy .link { color: #FF9A2E; text-decoration: none; font-size: 12px; cursor: pointer; }
  #root.legacy a.link { display: block; text-align: center; }
  #root.legacy .icon-circle {
    width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
    background: rgba(255, 154, 46, 0.1); margin: 0 auto 12px;
  }
  #root.legacy .icon-circle svg { display: block; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="popup.bundle.js"></script>
</body>
</html>
