<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mango Protocol — a non-custodial cross-chain bridge across Ethereum, Base, BNB Chain, Robinhood Chain, Stable, and Solana, plus a Uniswap v4 hook-based token launchpad." />
    <meta name="theme-color" content="#0A0C10" />
    <link rel="canonical" href="https://mangoprotocol.site/" />
    <title>Mango Protocol</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='10' y1='8' x2='54' y2='52' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%23FFD23D'/%3E%3Cstop offset='0.55' stop-color='%23FF9E2C'/%3E%3Cstop offset='1' stop-color='%237FCC2A'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230A0C10'/%3E%3Cpath d='M32 10c9 0 16 8.5 16 20s-8 22-16 22-16-10.5-16-22 7-20 16-20Z' fill='url(%23g)'/%3E%3C/svg%3E" />
    <!-- Real PNG fallback — the SVG above is the primary icon, but some
         crawlers/platforms (and the OG/Twitter tags below) need a real
         file at a fixed URL, not a data URI. Previously broken: this repo
         had no public/ directory, so /favicon.png and /logo.png were
         silently dropped from every Vite build and 404'd on the live
         site — fixed by adding public/favicon.png and public/logo.png. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Open Graph / Twitter card — the OG image below reuses the app logo
         since there's no dedicated 1200x630 share image yet; swap this for
         a real one whenever that gets made. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mango Protocol" />
    <meta property="og:title" content="Mango Protocol" />
    <meta property="og:description" content="A non-custodial cross-chain bridge across Ethereum, Base, BNB Chain, Robinhood Chain, Stable, and Solana, plus a Uniswap v4 hook-based token launchpad." />
    <meta property="og:url" content="https://mangoprotocol.site/" />
    <meta property="og:image" content="https://mangoprotocol.site/logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Mango Protocol" />
    <meta name="twitter:description" content="A non-custodial cross-chain bridge across Ethereum, Base, BNB Chain, Robinhood Chain, Stable, and Solana, plus a Uniswap v4 hook-based token launchpad." />
    <meta name="twitter:image" content="https://mangoprotocol.site/logo.png" />
    <meta name="twitter:site" content="@Mango_protocol" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
