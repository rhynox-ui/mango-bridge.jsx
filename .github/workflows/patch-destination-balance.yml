name: Patch destination balance display

on:
  push:
    branches:
      - fix/wallet-connect-sol-native-sol

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wallet-connect-sol-native-sol

      - name: Patch App.jsx once
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text()
          marker = 'const [toChainBalances, setToChainBalances] = useState({});'
          if marker in text:
              print('Patch already applied')
              raise SystemExit(0)

          old = '''  const [fromChainBalances, setFromChainBalances] = useState({});
  const [balancesLoading, setBalancesLoading] = useState(false);'''
          new = '''  const [fromChainBalances, setFromChainBalances] = useState({});
  const [balancesLoading, setBalancesLoading] = useState(false);
  // Real, live balances for the current "to" chain as well. The receive
  // side is informational, so we fetch the selected destination wallet's
  // actual balances without using them for MAX/insufficient-funds checks.
  const [toChainBalances, setToChainBalances] = useState({});
  const [toBalancesLoading, setToBalancesLoading] = useState(false);'''
          if old not in text:
              raise SystemExit('source balance state anchor not found')
          text = text.replace(old, new, 1)

          old = '''  useEffect(() => {
    refreshFromChainBalances();
  }, [refreshFromChainBalances]);'''
          new = '''  useEffect(() => {
    refreshFromChainBalances();
  }, [refreshFromChainBalances]);

  const refreshToChainBalances = useCallback(async (forceFresh = false) => {
    if (!connected) { setToChainBalances({}); return; }
    setToBalancesLoading(true);
    try {
      const real = CHAINS[to]?.isSolana
        ? await fetchSolanaBalance({ solanaAddress: activeSolanaAddress, forceFresh })
        : await fetchAllEvmBalances({ chainKey: to, nativeSymbol: NATIVE_SYMBOL_BY_CHAIN[to], address, forceFresh });
      setToChainBalances(real);
    } finally {
      setToBalancesLoading(false);
    }
  }, [connected, to, address, activeSolanaAddress]);

  useEffect(() => {
    refreshToChainBalances();
  }, [refreshToChainBalances]);'''
          if old not in text:
              raise SystemExit('source balance effect anchor not found')
          text = text.replace(old, new, 1)

          old = '''  const usingLiveBalanceTo = connected && (isNativeAssetTo || isRealUsdcPairTo || isCustomToToken || isCustomToSolanaToken);
  const liveBalanceLoadingTo = isCustomToSolanaToken ? customSolanaBalanceLoadingTo : isNativeAssetTo ? balanceLoadingTo : isCustomToToken ? customBalanceLoadingTo : usdcBalanceLoadingTo;
  const liveBalanceValueTo = isNativeAssetTo ? liveBalanceTo : isCustomToToken ? liveCustomBalanceTo : liveUsdcBalanceTo;'''
          new = '''  const hasFetchedToChainBalance = Object.prototype.hasOwnProperty.call(toChainBalances, toAsset.symbol);
  const usingLiveBalanceTo = connected && (
    (!toAsset.custom && (toBalancesLoading || hasFetchedToChainBalance)) ||
    isNativeAssetTo || isRealUsdcPairTo || isCustomToToken || isCustomToSolanaToken
  );
  const liveBalanceLoadingTo = !toAsset.custom && toBalancesLoading
    ? true
    : isCustomToSolanaToken
      ? customSolanaBalanceLoadingTo
      : isNativeAssetTo
        ? balanceLoadingTo
        : isCustomToToken
          ? customBalanceLoadingTo
          : usdcBalanceLoadingTo;
  const liveBalanceValueTo = hasFetchedToChainBalance
    ? { formatted: String(toChainBalances[toAsset.symbol] ?? 0) }
    : isNativeAssetTo
      ? liveBalanceTo
      : isCustomToToken
        ? liveCustomBalanceTo
        : liveUsdcBalanceTo;'''
          if old not in text:
              raise SystemExit('destination balance selector anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          print('Destination balance patch applied')
          PY

      - name: Commit destination balance patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: show destination wallet balance"
          git push origin HEAD:fix/wallet-connect-sol-native-sol
