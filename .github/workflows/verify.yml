name: Verify

# Verification/build runs on pull requests and main pushes.
# Dependency auditing lives in its own workflow so main pushes do not
# duplicate the audit work after a PR has already been checked.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Offline verification suite
        run: npm run verify

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
